name: dict_ai
description: Dict AI — AI-powered meeting recording, transcription and analysis.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.3"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.1

  # HTTP client
  dio: ^5.4.3+1

  # Secure storage (JWT persistence)
  flutter_secure_storage: ^9.0.0

  # Local storage fallback for macOS (no Keychain signing required)
  shared_preferences: ^2.2.3

  # File picker (audio upload on Desktop)
  file_picker: ^8.0.3

  # Microphone recording
  record: ^5.1.2

  # Audio playback (for anonymous speaker fragments)
  audioplayers: ^6.0.0

  # Temporary directory for recorded files
  path_provider: ^2.1.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

dependency_overrides:
  record_linux: ^1.2.1

flutter:
  uses-material-design: true
